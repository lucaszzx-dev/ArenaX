services:
  - type: web
    name: arenax-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --dir backend build
    startCommand: pnpm --dir backend db:migrate && node backend/dist/server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_COOKIE_NAME
        value: arenax_session
      - key: SESSION_TTL_DAYS
        value: "7"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
