services:
  postgres:
    image: postgres:17-alpine
    container_name: arenax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: arenax
      POSTGRES_USER: arenax
      POSTGRES_PASSWORD: arenax_dev
    ports:
      - "5432:5432"
    volumes:
      - arenax_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenax -d arenax"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arenax_postgres_data:
